services:
  db:
    image: postgres:16
    container_name: rawwedding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rawwedding
      POSTGRES_PASSWORD: rawwedding
      POSTGRES_DB: rawwedding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
